<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit and Remove createElement</title>
  </head>
  <body style="background-color: #212121; color: #fff">
    <ul class="language">
      <li>JavaScript</li>
    </ul>
  </body>
  <script>
    function addLanguage(lanhName) {
      const li = document.createElement("li");
      li.textContent = lanhName;
      document.querySelector(".language").appendChild(li);
    }
    addLanguage("Python");
    addLanguage("C++");
    /// optimal version
    function addOptiLanguage(langName) {
      const li = document.createElement("li");
      li.appendChild(document.createTextNode(langName));
      document.querySelector(".language").appendChild(li);
    }
    addOptiLanguage("Java");
    addOptiLanguage("Ruby");

    // Edit element
    const secondLi = document.querySelector(".language li:nth-child(2)");
    console.log(secondLi);
    // secondLi.textContent = "TypeScript";
    // secondLi.innerHTML = "TypeScript";
    const newLi = document.createElement("li");
    newLi.appendChild(document.createTextNode("TypeScript"));
    secondLi.replaceWith(newLi);

    // Edit
    const thirdLi = document.querySelector(".language li:nth-child(3)");
    thirdLi.outerHTML = "<li>GoLang</li>";

    // remove element
    // const liToRemove = document.querySelector(".language li:nth-child(2)");
    // liToRemove.remove();
  </script>
</html>
